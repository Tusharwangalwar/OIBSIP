
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive calculator built using HTML, CSS, and JavaScript.">
    <title>Calculator | OASIS INFOBYTE</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="site-header">
        <a href="#" class="brand">Calc<span>Studio.</span></a>
        <p>OASIS INFOBYTE · LEVEL 2</p>
    </header>

    <main class="page">
        <section class="calculator" aria-label="Calculator">

            <div class="calculator-heading">
                <p class="eyebrow">SIMPLE MATH. CLEAN DESIGN.</p>
                <h1>Calculator</h1>
                <p class="subtitle">Your everyday calculations, made simple.</p>
            </div>

            <!-- Display -->
            <div class="display" aria-live="polite">
                <div id="previous-display" class="previous-display"></div>
                <output id="display" class="current-display" aria-label="Calculator display">0</output>
            </div>

            <!-- Buttons: JavaScript will attach event listeners -->
            <div class="buttons" id="calculator-buttons">
                <button type="button" class="utility" data-action="clear">C</button>
                <button type="button" class="utility" data-action="backspace" aria-label="Backspace">⌫</button>
                <button type="button" class="operator" data-operator="/">÷</button>
                <button type="button" class="operator" data-operator="*">×</button>

                <button type="button" data-number="7">7</button>
                <button type="button" data-number="8">8</button>
                <button type="button" data-number="9">9</button>
                <button type="button" class="operator" data-operator="-">−</button>

                <button type="button" data-number="4">4</button>
                <button type="button" data-number="5">5</button>
                <button type="button" data-number="6">6</button>
                <button type="button" class="operator" data-operator="+">+</button>

                <button type="button" data-number="1">1</button>
                <button type="button" data-number="2">2</button>
                <button type="button" data-number="3">3</button>
                <button type="button" class="utility" data-action="sign">±</button>

                <button type="button" class="zero" data-number="0">0</button>
                <button type="button" data-action="decimal">.</button>
                <button type="button" class="equals" data-action="equals">=</button>
            </div>

            <p id="error-message" class="error-message" role="alert"></p>

            <p class="keyboard-hint">
                Tip: You can also use your keyboard for calculations.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>Built with HTML5, CSS3 &amp; JavaScript</p>
        <p>OASIS INFOBYTE · Web Development and Designing</p>
    </footer>

</body>
</html>
